version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "react-router-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@testing-library/jest-dom"
        update-types:
          - "version-update:semver-major"
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
